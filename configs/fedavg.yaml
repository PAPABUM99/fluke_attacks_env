hyperparameters:
  client:
    batch_size: 64
    local_epochs: 10
    loss: CrossEntropyLoss
    persistency: true
    optimizer:
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.00001
    scheduler:
      gamma: 1
      step_size: 1
  malicious_clients:
    sigma: 0.1
  server:
    weighted: true
    malicious_perc: 0.4
    niters: 5
    c: 1.0
    b: 10000
  model: MNIST_2NN
name: fluke.algorithms.attacks.fedavg_dnc_def.FedAVGAttack

